<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- 服务器机柜主体剪影 -->
  <!-- 左上机柜外框 (x: 2, y: 2, w: 18, h: 18) -->
  <rect x="2.5" y="2" width="17" height="18" rx="2.5" ry="2.5" fill="none" stroke="black" stroke-width="1.5" />
  
  <!-- 机柜层级分割线 (Server Blades) -->
  <!-- 第 1 层 -->
  <line x1="5" y1="6" x2="17" y2="6" stroke="black" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="6.5" cy="4" r="0.75" fill="black" />
  <circle cx="8.5" cy="4" r="0.75" fill="black" />

  <!-- 第 2 层 -->
  <line x1="5" y1="10" x2="17" y2="10" stroke="black" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="6.5" cy="8" r="0.75" fill="black" />

  <!-- 第 3 层 -->
  <line x1="5" y1="14" x2="17" y2="14" stroke="black" stroke-width="1.2" stroke-linecap="round" />

  <!-- ==================== 盾牌守护核心 (居中偏下覆盖) ==================== -->
  <!-- 盾牌外轮廓：带一层微弱的白色遮罩底衬（在负空间中切出轮廓），以防和机柜线混在一起 -->
  <!-- 盾牌背景实心遮挡 -->
  <path d="M 11 8.5
           C 14 8.5, 16.5 7.5, 17 7
           C 17.2 11, 17.5 15.5, 11 19.5
           C 4.5 15.5, 4.8 11, 5 7
           C 5.5 7.5, 8 8.5, 11 8.5 Z"
        fill="white"
        stroke="white"
        stroke-width="2" />

  <!-- 盾牌黑色线条与填充 -->
  <path d="M 11 9
           C 13.8 9, 16 8.2, 16.5 7.6
           C 16.7 11.2, 17 15, 11 18.8
           C 5 15, 5.3 11.2, 5.5 7.6
           C 6 8.2, 8.2 9, 11 9 Z"
        fill="black" />

  <!-- 盾牌内部镂空心跳生机折线 (负空间白线，在 template 模式下透出背景) -->
  <path d="M 7.8 13
           L 9.2 13
           L 10.1 11
           L 11.2 15.2
           L 12.2 12.2
           L 13 13
           L 14.2 13"
        fill="none"
        stroke="white"
        stroke-width="1.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
